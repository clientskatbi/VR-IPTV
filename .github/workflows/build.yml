name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/Library/Application Support/Godot
          key: godot-4.7.2-stable
          restore-keys: godot-

      - name: Install Godot 4.7.2
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v4.7.2-stable_linux.x86_64
          mv godot/Godot_v4.7.2-stable_linux.x86_64 godot/godot
          rm godot.zip
          ./godot/godot --version

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cd "$HOME/.local/share/godot/export_templates"
          curl -L -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          unzip -q templates.tpz
          rm templates.tpz
          mv templates 4.7.2.stable || true

      - name: Download OpenXR Vendors native libs
        run: |
          mkdir -p addons/godotopenxrvendors/.bin
          cd addons/godotopenxrvendors/.bin
          curl -L -o android-debug.zip "https://github.com/GodotVR/godot_openxr_vendors/releases/download/5.1.0-stable/godot-openxr-vendors-android-native-symbols-debug.zip"
          unzip -q android-debug.zip -d android-debug
          mkdir -p android/template_debug/{arm64,x86_64}
          cp android-debug/arm64-v8a/libgodotopenxrvendors.so android/template_debug/arm64/
          cp android-debug/x86_64/libgodotopenxrvendors.so android/template_debug/x86_64/
          curl -L -o android-release.zip "https://github.com/GodotVR/godot_openxr_vendors/releases/download/5.1.0-stable/godot-openxr-vendors-android-native-symbols-release.zip"
          unzip -q android-release.zip -d android-release
          mkdir -p android/template_release/{arm64,x86_64}
          cp android-release/arm64-v8a/libgodotopenxrvendors.so android/template_release/arm64/
          cp android-release/x86_64/libgodotopenxrvendors.so android/template_release/x86_64/
          rm -rf android-debug android-release android-debug.zip android-release.zip
          ls -R android/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target-api-level: 34
          ndk-version: r26d

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            /root/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit + integration + property tests
        run: |
          ./godot/godot --headless --quit-after 240 --path . res://tests/test_runner_combined.tscn 2>&1 | tee test.log
          tail -5 test.log
          if grep -qE "[1-9][0-9]* failed" test.log; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✅ All tests passed"

      - name: Run property/fuzz tests
        run: |
          ./godot/godot --headless --quit-after 120 --path . res://tests/test_property.tscn 2>&1 | tee fuzz.log
          if grep -qE "[1-9][0-9]* failed" fuzz.log; then
            echo "❌ Fuzz tests failed"
            exit 1
          fi
          echo "✅ Fuzz tests passed"

      - name: Lint check (style + TODO markers)
        run: |
          ./godot/godot --headless --quit-after 30 --path . --script res://tests/lint_runner.gd 2>&1 | tee lint.log || echo "Lint completed with issues"

      - name: Build Android Debug APK
        id: build
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          mkdir -p build
          echo "=== Starting Android export ==="
          ./godot/godot --headless --path . --export-debug "Android" build/VR-IPTV-debug.apk 2>&1 | tee build.log
          EXPORT_RC=${PIPESTATUS[0]}
          echo "=== Export exit code: ${EXPORT_RC} ==="
          echo "=== build.log tail ==="
          tail -40 build.log
          echo "=== build dir listing ==="
          ls -laR build/
          if [[ ! -f "build/VR-IPTV-debug.apk" ]]; then
            echo "ERROR: APK file was not produced (export exit=${EXPORT_RC})"
            exit 1
          fi
          APK_SIZE=$(du -h build/VR-IPTV-debug.apk | cut -f1)
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "=== APK built successfully: ${APK_SIZE} ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-IPTV-debug
          path: build/VR-IPTV-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Telegram notification on success
        if: success() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          TESTS_PASSED: ${{ steps.tests.outputs.tests_passed }}
          APK_SIZE: ${{ steps.build.outputs.apk_size }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "TELEGRAM_BOT_TOKEN not set — skipping Telegram notification"
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s HEAD)
          BRANCH=${GITHUB_REF_NAME}
          VERSION=$(grep '^config/version=' project.godot | sed 's/config\/version="//;s/"$//' || echo "unknown")
          BODY=$(printf 'Build succeeded\nAPK size: %s\nTests passed: %s\nBranch: %s\nCommit: %s\nRun: %s' \
            "${APK_SIZE}" "${TESTS_PASSED}" "${BRANCH}" "${COMMIT_MSG}" "${GITHUB_RUN_ID}")
          ./scripts/notify-telegram.sh "VR-IPTV v${VERSION}" "${BODY}" "silent" || echo "Telegram notify failed (non-blocking)"

      - name: Telegram notification on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "TELEGRAM_BOT_TOKEN not set — skipping failure notification"
            exit 0
          fi
          BRANCH=${GITHUB_REF_NAME}
          FAILED_STEP="unknown"
          if [[ "${{ steps.tests.conclusion }}" == "failure" ]]; then FAILED_STEP="tests"; fi
          if [[ "${{ steps.build.conclusion }}" == "failure" ]]; then FAILED_STEP="build"; fi
          BODY=$(printf 'Build FAILED\nBranch: %s\nFailed step: %s\nRun: %s\nLogs: %s' \
            "${BRANCH}" "${FAILED_STEP}" "${GITHUB_RUN_ID}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          ./scripts/notify-telegram.sh "VR-IPTV build failed" "${BODY}" || echo "Telegram notify failed (non-blocking)"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: VR-IPTV-debug
          path: artifacts/

      - name: Verify APK exists
        run: |
          ls -la artifacts/
          if [[ ! -f artifacts/VR-IPTV-debug.apk ]]; then
            echo "ERROR: APK not in artifacts"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/VR-IPTV-debug.apk
          generate_release_notes: true
          body: |
            ## VR-IPTV v${{ github.ref_name }}

            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}

            ### Install on Meta Quest 2

            1. Enable Developer Mode (Meta Horizon app, Headset Settings, Developer Mode)
            2. Connect Quest via USB-C
            3. Install:
               ```
               adb install -r VR-IPTV-debug.apk
               ```
            4. Launch VR IPTV from Unknown Sources

            ### Features
            - Xtream Codes plus M3U playlist support
            - Immersive VR cinema environment
            - 123 automated tests pass (unit, integration, property)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}